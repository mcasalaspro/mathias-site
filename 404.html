<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada — Mathias Casalaspro</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{ --noite:#071523; --ouro:#C9A24B; --marfim:#F1EBDF; --nevoa:#8FA6BD; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; display:grid; place-items:center; text-align:center;
    background:var(--noite); color:var(--marfim); padding:32px;
    font-family:"Archivo",system-ui,sans-serif;
    background-image:
      linear-gradient(rgba(201,162,75,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,162,75,.06) 1px, transparent 1px);
    background-size:80px 80px, 80px 80px;
  }
  .peca{ font-size:3.4rem; color:var(--ouro); line-height:1; margin-bottom:22px; }
  h1{ font-size:clamp(1.7rem,4vw,2.6rem); font-weight:800; letter-spacing:-.025em; margin:0 0 14px; }
  p{ color:var(--nevoa); max-width:44ch; margin:0 auto 30px; line-height:1.6; }
  code{ font-family:"JetBrains Mono",monospace; font-size:.85em; color:var(--ouro); }
  a{
    display:inline-flex; align-items:center; gap:9px; background:var(--ouro); color:var(--noite);
    text-decoration:none; font-weight:700; padding:14px 26px; border-radius:3px;
  }
</style>
</head>
<body>
  <main>
    <p class="peca" aria-hidden="true">♘</p>
    <h1>Lance ilegal</h1>
    <p>Essa página não existe neste tabuleiro. Deve ter sido movida, ou o endereço veio com um
    caractere trocado.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
