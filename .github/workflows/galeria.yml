name: Atualizar galeria

# Roda sempre que alguém adiciona ou remove fotos em assets/galeria/.
# Lê a pasta, reescreve dados/galeria.json e preserva as legendas já escritas.
on:
  push:
    paths:
      - 'assets/galeria/**'
      - '.github/workflows/galeria.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gerar dados/galeria.json
        run: |
          python3 - <<'PY'
          import json, os, re

          PASTA = "assets/galeria"
          SAIDA = "dados/galeria.json"
          EXT = (".jpg", ".jpeg", ".png", ".webp", ".avif")

          os.makedirs(PASTA, exist_ok=True)
          arquivos = sorted(
              (f for f in os.listdir(PASTA) if f.lower().endswith(EXT) and not f.startswith((".", "_"))),
              reverse=True,   # nomes começando com a data deixam as mais recentes na frente
          )

          # Preserva o que já foi escrito à mão
          antigo = {}
          cabeca = None
          if os.path.exists(SAIDA):
              try:
                  d = json.load(open(SAIDA, encoding="utf-8"))
                  cabeca = d.get("_leia")
                  antigo = {f.get("arquivo"): f for f in d.get("fotos", []) if f.get("arquivo")}
              except Exception:
                  pass

          def legenda_do_nome(nome):
              """2026-08_leca-chess-open_primeira-norma.jpg -> 'Leça Chess Open · Primeira norma'"""
              base = re.sub(r"\.[^.]+$", "", nome)
              partes = [p for p in base.split("_") if p]
              if partes and re.fullmatch(r"\d{4}(-\d{2})?", partes[0]):
                  partes = partes[1:]
              texto = " · ".join(p.replace("-", " ").strip().capitalize() for p in partes)
              return texto

          fotos = []
          for nome in arquivos:
              if nome in antigo:
                  fotos.append(antigo[nome])
              else:
                  fotos.append({
                      "arquivo": nome,
                      "destaque": "",
                      "legenda": legenda_do_nome(nome),
                      "alt": "Mathias Casalaspro em torneio de xadrez",
                  })

          saida = {
              "_leia": cabeca or ("Gerado automaticamente pela GitHub Action quando você adiciona ou remove "
                                  "fotos em assets/galeria/. Você só precisa editar as legendas — elas são "
                                  "preservadas a cada atualização."),
              "fotos": fotos,
          }
          json.dump(saida, open(SAIDA, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          open(SAIDA, "a", encoding="utf-8").write("\n")
          print(f"{len(fotos)} foto(s) indexada(s)")
          PY

      - name: Publicar mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet dados/galeria.json; then
            echo "Nada mudou."
          else
            git add dados/galeria.json
            git commit -m "Atualiza índice da galeria [skip ci]"
            git push
          fi
