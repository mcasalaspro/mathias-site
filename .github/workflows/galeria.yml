name: Atualizar imagens

# Roda sempre que alguém adiciona ou remove imagens em assets/galeria/ ou assets/hero/.
# Lê as pastas, reescreve dados/galeria.json e dados/hero.json, e preserva os textos
# que você já tiver escrito.
on:
  push:
    paths:
      - 'assets/galeria/**'
      - 'assets/hero/**'
      - '.github/workflows/galeria.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Indexar as pastas de imagens
        run: |
          python3 - <<'PY'
          import json, os, re

          EXT = (".jpg", ".jpeg", ".png", ".webp", ".avif")

          def legenda_do_nome(nome):
              """2026-08_leca-chess-open_primeira-norma.jpg -> 'Leça Chess Open · Primeira norma'"""
              base = re.sub(r"\.[^.]+$", "", nome)
              partes = [p for p in base.split("_") if p]
              if partes and re.fullmatch(r"\d{2,4}(-\d{2})?", partes[0]):
                  partes = partes[1:]
              return " · ".join(p.replace("-", " ").strip().capitalize() for p in partes)

          def indexar(pasta, saida, campo_texto, molde):
              os.makedirs(pasta, exist_ok=True)
              arquivos = sorted(
                  (f for f in os.listdir(pasta)
                   if f.lower().endswith(EXT) and not f.startswith((".", "_"))),
                  reverse=(campo_texto == "legenda"),   # galeria: mais recentes primeiro
              )

              antigo, extras = {}, {}
              if os.path.exists(saida):
                  try:
                      d = json.load(open(saida, encoding="utf-8"))
                      extras = {k: v for k, v in d.items() if k != "fotos"}
                      antigo = {f.get("arquivo"): f for f in d.get("fotos", []) if f.get("arquivo")}
                  except Exception:
                      pass

              fotos = []
              for nome in arquivos:
                  if nome in antigo:
                      fotos.append(antigo[nome])
                  else:
                      novo = dict(molde)
                      novo["arquivo"] = nome
                      novo[campo_texto] = legenda_do_nome(nome)
                      fotos.append(novo)

              saida_json = dict(extras)
              saida_json["fotos"] = fotos
              json.dump(saida_json, open(saida, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
              open(saida, "a", encoding="utf-8").write("\n")
              print(f"{saida}: {len(fotos)} imagem(ns)")

          indexar("assets/galeria", "dados/galeria.json", "legenda",
                  {"arquivo": "", "destaque": "", "legenda": "",
                   "alt": "Mathias Casalaspro em torneio de xadrez"})

          indexar("assets/hero", "dados/hero.json", "credito",
                  {"arquivo": "", "credito": ""})
          PY

      - name: Publicar mudanças
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet dados/galeria.json dados/hero.json; then
            echo "Nada mudou."
          else
            git add dados/galeria.json dados/hero.json
            git commit -m "Atualiza índice de imagens [skip ci]"
            git push
          fi
